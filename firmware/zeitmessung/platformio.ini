; PlatformIO-Projekt für die Siloplanen-Race-Zeitmessung (ESP32).
; Siehe README.md für Pinbelegung, Verkabelung und Ersteinrichtung.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Kein OTA nötig -> größere Single-App-Partition statt der knappen
; Standard-OTA-Aufteilung (die lag bei 93% Flash-Auslastung).
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    mathieucarbou/ESPAsyncWebServer @ ^3.3.11
    mathieucarbou/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
