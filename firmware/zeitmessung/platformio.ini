; PlatformIO-Projekt für die Siloplanen-Race-Zeitmessung (ESP32).
; Siehe README.md für Pinbelegung, Verkabelung und Ersteinrichtung.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Eigene Partitionstabelle mit 2 App-Slots (OTA) statt Single-App-Partition
; - siehe partitions_ota.csv fuer die Begruendung der Aufteilung.
board_build.partitions = partitions_ota.csv
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
upload_speed = 115200
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    mathieucarbou/ESPAsyncWebServer @ ^3.3.11
    mathieucarbou/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Zweite Umgebung fuer Updates uebers WLAN (kein USB/Boot-Taste noetig),
; sobald die OTA-faehige Firmware einmal per USB installiert ist:
;   pio run -e esp32dev_ota -t upload --upload-port <IP-des-ESP32> \
;     --upload-flags="--auth=<aktueller-API-Key>"
; Die IP steht auf der Geraete-Weboberflaeche (/) oder per Serial-Befehl
; "status". Das Passwort ist der aktuelle API-Key (siehe "status").
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags =
    --auth=${sysenv.ZEITMESSUNG_OTA_PASS}
