; PlatformIO-Projekt für die Siloplanen-Race-Zeitmessung (Arduino Mega 2560).
; Ersetzt den ESP32 (siehe ../zeitmessung/) als Zeitmessung-Hardware: liest
; dieselben 4 Kontakte, meldet Auslösungen aber NUR über USB-Seriell an eine
; lokale Desktop-App, statt per WLAN/HTTP an die Webapp - robuster bei
; Strom-/WLAN-Ausfall am Veranstaltungsort. Kein WiFi/OTA/NTP nötig, daher
; keine externen Bibliotheken. Siehe README.md.

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; COM-Port kann sich bei USB-Neuerkennung ändern (war COM3, dann COM5, jetzt
; COM6 auf diesem Entwicklungs-PC) - bei "port not found" mit
; [System.IO.Ports.SerialPort]::getportnames() (PowerShell) aktuellen Port
; prüfen und hier anpassen.
upload_port = COM6
monitor_port = COM6
