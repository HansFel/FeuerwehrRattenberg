{% extends "base.html" %}
{% block titel %}Besucheransicht{% endblock %}
{% block inhalt %}
  <h1>🏆 Aktueller Stand</h1>

  <div id="besucher-wertung-bereich">
{% include "besucher/_wertung.html" %}
  </div>

  <h2 style="margin-top:2rem">Zeitplan</h2>
  <div id="besucher-zeitplan-bereich">
{% include "besucher/_zeitplan.html" %}
  </div>

  <script>
  (function () {
    var wertungBereich = document.getElementById('besucher-wertung-bereich');
    var zeitplanBereich = document.getElementById('besucher-zeitplan-bereich');
    function aktualisieren() {
      fetch("{{ url_for('besucher.live_fragment') }}")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (daten) {
          if (wertungBereich) wertungBereich.innerHTML = daten.wertung_html;
          if (zeitplanBereich) zeitplanBereich.innerHTML = daten.zeitplan_html;
        })
        .catch(function () { /* naechster Versuch beim naechsten Intervall */ });
    }
    window.setInterval(aktualisieren, 5000);
  })();
  </script>
{% endblock %}
