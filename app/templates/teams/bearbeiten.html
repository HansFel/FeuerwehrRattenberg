{% extends "base.html" %}
{% block titel %}{{ "Mannschaft bearbeiten" if team else "Neue Mannschaft" }}{% endblock %}
{% block inhalt %}
  <h1>{{ "Mannschaft bearbeiten" if team else "Neue Mannschaft" }}</h1>

  <form class="formular" method="post">
    <label for="name">Name der Mannschaft *</label>
    <input type="text" id="name" name="name" required value="{{ team.name if team else '' }}">

    <label for="wehr">Wehr / Ort</label>
    <input type="text" id="wehr" name="wehr" value="{{ team.wehr if team else '' }}">

    <label for="startnummer">Startnummer</label>
    <input type="number" id="startnummer" name="startnummer"
           value="{{ team.startnummer if team and team.startnummer is not none else '' }}">

    <fieldset style="margin-top:1rem; border:1px solid var(--rand); border-radius:6px; padding:0.5rem 1rem 1rem;">
      <legend style="font-weight:600;">Mannschaft (4 Personen)</legend>
      {% for i in range(1, 5) %}
      <label for="person_{{ i }}">Person {{ i }}</label>
      <input type="text" id="person_{{ i }}" name="person_{{ i }}"
             value="{{ personen[i-1] if personen and personen|length >= i else '' }}">
      {% endfor %}
    </fieldset>

    <label for="kontakt">Kontakt (Name / Telefon)</label>
    <input type="text" id="kontakt" name="kontakt" value="{{ team.kontakt if team else '' }}">

    <label for="notiz">Notiz</label>
    <textarea id="notiz" name="notiz">{{ team.notiz if team else '' }}</textarea>

    <div class="werkzeugleiste" style="margin-top:1rem">
      <button class="knopf" type="submit">Speichern</button>
      <a class="knopf grau" href="{{ url_for('teams.liste') }}">Abbrechen</a>
    </div>
  </form>
{% endblock %}
