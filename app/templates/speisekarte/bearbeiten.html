{% extends "base.html" %}
{% block titel %}{{ "Artikel bearbeiten" if artikel else "Neuer Artikel" }}{% endblock %}
{% block inhalt %}
  <h1>{{ "Artikel bearbeiten" if artikel else "Neuer Artikel" }}</h1>

  <form class="formular" method="post">
    <label for="name">Name *</label>
    <input type="text" id="name" name="name" required
           value="{{ artikel.name if artikel else '' }}">

    <label for="kategorie">Kategorie</label>
    <select id="kategorie" name="kategorie">
      {% for key, bezeichnung in KATEGORIEN.items() %}
        <option value="{{ key }}" {{ 'selected' if artikel and artikel.kategorie == key else '' }}>
          {{ bezeichnung }}</option>
      {% endfor %}
    </select>

    <label for="preis">Preis (€)</label>
    <input type="text" id="preis" name="preis"
           value="{{ '%.2f'|format(artikel.preis) if artikel else '0.00' }}">

    <label for="punkte_pro_einheit">Punkte für das Team pro Einheit</label>
    <input type="number" min="0" id="punkte_pro_einheit" name="punkte_pro_einheit"
           value="{{ artikel.punkte_pro_einheit if artikel else 0 }}">

    <label for="reihenfolge">Reihenfolge auf der Speisekarte</label>
    <input type="number" id="reihenfolge" name="reihenfolge"
           value="{{ artikel.reihenfolge if artikel else 0 }}">

    <label style="margin-top:0.8rem">
      <input type="checkbox" name="aktiv" {{ 'checked' if not artikel or artikel.aktiv else '' }}>
      aktiv (auf der Bestellseite sichtbar)
    </label>

    <div class="werkzeugleiste" style="margin-top:1rem">
      <button class="knopf" type="submit">Speichern</button>
      <a class="knopf grau" href="{{ url_for('speisekarte.liste') }}">Abbrechen</a>
    </div>
  </form>
{% endblock %}
