[project]
name = "zeitmessung-desktop"
version = "0.1.0"
description = "Lokale Desktop-App für die Siloplanen-Race-Zeitmessung: liest den Arduino Mega 2560 seriell aus und synchronisiert mit der FeuerwehrRattenberg-Webapp."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pyserial>=3.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
