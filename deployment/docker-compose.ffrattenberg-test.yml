# Zwei Testinstanzen für Personal-Schulung auf dem ffrattenberg-Server,
# erreichbar per Pfad-Präfix unter derselben Domain wie die Produktion
# (spart DuckDNS-Slots, nutzt das schon vorhandene Pfad-Präfix-Feature der
# App - siehe app/__init__.py PrefixMiddleware, gleiches Muster wie früher
# beim NAS-Deployment mit "/silo").
#
# Nutzt bewusst dasselbe, schon gebaute Image wie die Produktion
# (ffrattenberg-app:${BUILD_TAG}) - kein eigener Build nötig, da der
# App-Code identisch ist, nur DB/Konfiguration pro Instanz getrennt sind.
#
# Erreichbar unter:
#   https://ffrattenberg.duckdns.org/test1
#   https://ffrattenberg.duckdns.org/test2
#   https://ffrattenberg.duckdns.org/generalprobe
#
# Die Datenbanken werden einmalig mit einer Kopie der Produktions-DB
# befüllt (pg_dump/restore), danach unabhängig voneinander - Personal kann
# dort frei testen, ohne die echten Wettbewerbsdaten zu verändern.
#
# /generalprobe ist zusätzlich zu test1/test2 auf BEIDEN Servern (aktiver
# Server "ffrattenberg" UND Standby-ThinkPad) angelegt, damit vor der
# eigentlichen Veranstaltung eine vollständige Generalprobe unter
# realistischen Bedingungen (echte Team-Daten, beide Standorte) möglich ist.
#
# Alle drei Instanzen melden sich selbst bei der Produktion
# (app-ffrattenberg, erreichbar über das gemeinsame "traefik"-Docker-Netz)
# als Weiterleitungs-Ziel für ESP32-Zeitmessung-Ereignisse an - der ESP32
# selbst kennt weiterhin nur EIN Ziel, siehe app/blueprints/zeitmessung.py
# (abonnieren()/_an_abonnenten_weiterleiten()) und
# app/__init__.py:_bei_quelle_anmelden().
#
# Zusätzlich direkt im lokalen Netz erreichbar (ohne Traefik/TLS, wie schon
# bei der Produktion auf Port 8000) - Grund hier: die öffentliche Domain
# wird von Google Safe Browsing als "gefährlich" gemeldet (generisches
# duckdns.org-Login-Formular, siehe AGENTS.md), Personal vor Ort kann die
# App bis zur Google-Überprüfung trotzdem über das lokale WLAN nutzen:
#   test1        -> http://<server-lan-ip>:8001/
#   test2        -> http://<server-lan-ip>:8002/
#   generalprobe -> http://<server-lan-ip>:8003/
services:
  db-test1:
    image: postgres:17
    container_name: db-ffrattenberg-test1
    restart: unless-stopped
    environment:
      POSTGRES_DB: wettbewerb
      POSTGRES_USER: silo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD_TEST1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo_user -d wettbewerb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-ffrattenberg-test1-data:/var/lib/postgresql/data
    networks:
      - test1-internal

  app-test1:
    image: ffrattenberg-app:${BUILD_TAG}
    container_name: app-ffrattenberg-test1
    restart: unless-stopped
    depends_on:
      db-test1:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://silo_user:${DB_PASSWORD_TEST1}@db-test1:5432/wettbewerb
      SECRET_KEY: ${SECRET_KEY_TEST1}
      ADMIN_STARTPASSWORT: ${ADMIN_STARTPASSWORT_TEST1}
      ZEITMESSUNG_API_KEY: ${ZEITMESSUNG_API_KEY_TEST1}
      ZEITMESSUNG_QUELLE_URL: http://app-ffrattenberg:8000/api/zeitmessung/abonnieren
      ZEITMESSUNG_QUELLE_API_KEY: ${ZEITMESSUNG_API_KEY_PRODUKTION}
      FLASK_APP: run.py
      FLASK_ENV: production
      INSTANCE_NAME: ffrattenberg-test1
      GUNICORN_WORKERS: "2"
    volumes:
      - ffrattenberg-test1-instance-data:/opt/wettbewerb/instance
    ports:
      - "8001:8000"
    networks:
      - test1-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ffrattenberg-test1.rule=Host(`ffrattenberg.duckdns.org`) && PathPrefix(`/test1`)"
      - "traefik.http.routers.ffrattenberg-test1.entrypoints=websecure"
      - "traefik.http.routers.ffrattenberg-test1.tls.certresolver=duckdns"
      - "traefik.http.services.ffrattenberg-test1.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.ffrattenberg-test1-headers.headers.customrequestheaders.X-Script-Name=/test1"
      - "traefik.http.routers.ffrattenberg-test1.middlewares=ffrattenberg-test1-headers"

  db-test2:
    image: postgres:17
    container_name: db-ffrattenberg-test2
    restart: unless-stopped
    environment:
      POSTGRES_DB: wettbewerb
      POSTGRES_USER: silo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD_TEST2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo_user -d wettbewerb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-ffrattenberg-test2-data:/var/lib/postgresql/data
    networks:
      - test2-internal

  app-test2:
    image: ffrattenberg-app:${BUILD_TAG}
    container_name: app-ffrattenberg-test2
    restart: unless-stopped
    depends_on:
      db-test2:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://silo_user:${DB_PASSWORD_TEST2}@db-test2:5432/wettbewerb
      SECRET_KEY: ${SECRET_KEY_TEST2}
      ADMIN_STARTPASSWORT: ${ADMIN_STARTPASSWORT_TEST2}
      ZEITMESSUNG_API_KEY: ${ZEITMESSUNG_API_KEY_TEST2}
      ZEITMESSUNG_QUELLE_URL: http://app-ffrattenberg:8000/api/zeitmessung/abonnieren
      ZEITMESSUNG_QUELLE_API_KEY: ${ZEITMESSUNG_API_KEY_PRODUKTION}
      FLASK_APP: run.py
      FLASK_ENV: production
      INSTANCE_NAME: ffrattenberg-test2
      GUNICORN_WORKERS: "2"
    volumes:
      - ffrattenberg-test2-instance-data:/opt/wettbewerb/instance
    ports:
      - "8002:8000"
    networks:
      - test2-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ffrattenberg-test2.rule=Host(`ffrattenberg.duckdns.org`) && PathPrefix(`/test2`)"
      - "traefik.http.routers.ffrattenberg-test2.entrypoints=websecure"
      - "traefik.http.routers.ffrattenberg-test2.tls.certresolver=duckdns"
      - "traefik.http.services.ffrattenberg-test2.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.ffrattenberg-test2-headers.headers.customrequestheaders.X-Script-Name=/test2"
      - "traefik.http.routers.ffrattenberg-test2.middlewares=ffrattenberg-test2-headers"

  db-generalprobe:
    image: postgres:17
    container_name: db-ffrattenberg-generalprobe
    restart: unless-stopped
    environment:
      POSTGRES_DB: wettbewerb
      POSTGRES_USER: silo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD_GENERALPROBE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo_user -d wettbewerb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-ffrattenberg-generalprobe-data:/var/lib/postgresql/data
    networks:
      - generalprobe-internal

  app-generalprobe:
    image: ffrattenberg-app:${BUILD_TAG}
    container_name: app-ffrattenberg-generalprobe
    restart: unless-stopped
    depends_on:
      db-generalprobe:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://silo_user:${DB_PASSWORD_GENERALPROBE}@db-generalprobe:5432/wettbewerb
      SECRET_KEY: ${SECRET_KEY_GENERALPROBE}
      ADMIN_STARTPASSWORT: ${ADMIN_STARTPASSWORT_GENERALPROBE}
      ZEITMESSUNG_API_KEY: ${ZEITMESSUNG_API_KEY_GENERALPROBE}
      ZEITMESSUNG_QUELLE_URL: http://app-ffrattenberg:8000/api/zeitmessung/abonnieren
      ZEITMESSUNG_QUELLE_API_KEY: ${ZEITMESSUNG_API_KEY_PRODUKTION}
      FLASK_APP: run.py
      FLASK_ENV: production
      INSTANCE_NAME: ffrattenberg-generalprobe
      GUNICORN_WORKERS: "2"
    volumes:
      - ffrattenberg-generalprobe-instance-data:/opt/wettbewerb/instance
    ports:
      - "8003:8000"
    networks:
      - generalprobe-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ffrattenberg-generalprobe.rule=Host(`ffrattenberg.duckdns.org`) && PathPrefix(`/generalprobe`)"
      - "traefik.http.routers.ffrattenberg-generalprobe.entrypoints=websecure"
      - "traefik.http.routers.ffrattenberg-generalprobe.tls.certresolver=duckdns"
      - "traefik.http.services.ffrattenberg-generalprobe.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.ffrattenberg-generalprobe-headers.headers.customrequestheaders.X-Script-Name=/generalprobe"
      - "traefik.http.routers.ffrattenberg-generalprobe.middlewares=ffrattenberg-generalprobe-headers"

volumes:
  db-ffrattenberg-test1-data:
  ffrattenberg-test1-instance-data:
  db-ffrattenberg-test2-data:
  ffrattenberg-test2-instance-data:
  db-ffrattenberg-generalprobe-data:
  ffrattenberg-generalprobe-instance-data:

networks:
  test1-internal:
  test2-internal:
  generalprobe-internal:
  traefik:
    external: true
